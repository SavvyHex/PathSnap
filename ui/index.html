<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PathSnap evaluator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
    #side { width: 300px; padding: 16px; box-sizing: border-box; overflow: auto; }
    #map { flex: 1; }
    button { display: block; width: 100%; margin: 4px 0; padding: 8px; text-align: left; }
    #stats { margin-top: 12px; font-size: 14px; white-space: pre-line; }
  </style>
</head>
<body>
  <div id="side">
    <h2>PathSnap</h2>
    <p>Select one of the reserved evaluation trips.</p>
    <div id="trips">Loading trips...</div>
    <div id="stats"></div>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
